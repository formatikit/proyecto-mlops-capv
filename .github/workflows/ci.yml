name: MLOps CI Pipeline CAPV

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: setup-python@v4
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pydantic scikit-learn pandas numpy joblib pytest
    - name: Run Validation
      run: |
        python -c "import joblib; print('[OK] Entorno de integración verificado con éxito.')"
