name: MLOps CI Pipeline CAPV

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pydantic scikit-learn pandas numpy joblib pytest

    - name: Run Model and API Validation Tests
      run: |
        python -c "import joblib; model = joblib.load('models/modelo_campeon_capv.pkl'); print('[OK] Modelo campeon cargado con exito en runner.')"
